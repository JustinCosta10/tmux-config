session_name: supercode
start_directory: ${PWD}
windows:
  - window_name: main
    layout: main-vertical
    options:
      main-pane-width: 50%
    panes:
      - shell_command:
          - yazi
        focus: true
      - shell_command: []
      - shell_command:
          - pi --provider ollama --model deepseek-v4-pro:cloud
  - window_name: git
    panes:
      - shell_command:
          - lazygit
  - window_name: terminals
    layout: tiled
    panes:
      - shell_command: []
      - shell_command: []
      - shell_command: []
      - shell_command: []

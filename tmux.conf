# Use Ctrl-A as the tmux prefix.
unbind C-b
unbind F12
set -g prefix C-a
bind C-a send-prefix

# Split panes without shift
bind = split-window -h
bind - split-window -v

# Vim-style pane switching
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Start windows at 1
set -g base-index 1

# Enable mouse support (scroll, pane select, resize)
set -g mouse on

# Let tmux use the terminal clipboard integration when available.
set -g set-clipboard on

# Vi mode for copy
setw -g mode-keys vi

# Vi-style selection and yank to system clipboard.
# Copy command is cross-platform: pbcopy (macOS), wl-copy (Wayland), xclip (X11).
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "sh -c 'if command -v pbcopy >/dev/null 2>&1; then pbcopy; elif command -v wl-copy >/dev/null 2>&1; then wl-copy; else xclip -selection clipboard -in; fi'"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "sh -c 'if command -v pbcopy >/dev/null 2>&1; then pbcopy; elif command -v wl-copy >/dev/null 2>&1; then wl-copy; else xclip -selection clipboard -in; fi'"

# Mouse selection copies to system clipboard
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "sh -c 'if command -v pbcopy >/dev/null 2>&1; then pbcopy; elif command -v wl-copy >/dev/null 2>&1; then wl-copy; else xclip -selection clipboard -in; fi'"

# Forward focus events to Neovim (enables auto-reload of changed files)
set -g focus-events on

set -g extended-keys on

# Allow terminal feature detection and image protocols through tmux.
set -g allow-passthrough on

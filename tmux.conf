# Caps Lock is remapped to F12 via hidutil. Keep C-a as a fallback.
unbind C-b
set -g prefix F12
set -g prefix2 C-a
bind F12 send-prefix
bind C-a send-prefix

# Split panes without shift
bind = split-window -h
bind - split-window -v

# Vim-style pane switching
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Start windows at 1
set -g base-index 1

# Enable mouse support (scroll, pane select, resize)
set -g mouse on

# Let tmux use the terminal clipboard integration when available.
set -g set-clipboard on

# Vi mode for copy
setw -g mode-keys vi

# Vi-style selection and yank to system clipboard
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"

# Mouse selection copies to system clipboard
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# Forward focus events to Neovim (enables auto-reload of changed files)
set -g focus-events on

set -g extended-keys on

set -g extended-keys-format csi-u
